<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷你互传助手</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="container">
        <h1>📁 迷你互传助手 <span id="versionBadge" class="version-badge"></span></h1>

        <div class="section">
            <button id="selectFolderBtn" class="btn primary">选择共享文件夹</button>
            <div class="path-row">
                <div id="selectedPath" class="path-display">未选择</div>
                <div class="icon-actions">
                    <button id="copyPathBtn" class="icon-btn" title="复制路径" type="button" aria-label="复制路径">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <button id="openFolderBtn" class="icon-btn" title="打开文件夹" type="button" aria-label="打开文件夹">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    </button>
                    <button id="clearPathBtn" class="icon-btn icon-btn-clear" title="清空文件夹" type="button" aria-label="清空文件夹">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div class="path-hint">
                <div>・ 要传输的文件放置到以上文件夹中</div>
                <div>・ 接收的文件存放在子文件夹【来自手机】中</div>
            </div>
        </div>

        <div id="serverSection" class="section">
            <div class="server-layout">
                <div class="qr-container">
                    <div id="qrCode"><div class="stopped">请先选择共享文件夹</div></div>
                </div>
                <div id="connectGuide" class="server-info">
                    <p class="info-title">如何连接？</p>
                    <p class="info-text">1. 确保手机和电脑在同一 WiFi</p>
                    <p class="info-text">2. 启动服务</p>
                    <p class="info-text">3. 用手机扫描二维码</p>
                    <p class="info-text">4. 在浏览器中打开链接</p>
                </div>
                <div class="url-row">
                    <div id="serverUrl" class="url-display"></div>
                    <button id="copyUrlBtn" class="icon-btn" title="复制链接" type="button" aria-label="复制链接">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <button id="serverToggleBtn" class="btn success" disabled>启动服务</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.ts"></script>
</body>
</html>
